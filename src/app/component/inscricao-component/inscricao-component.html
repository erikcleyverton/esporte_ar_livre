<div id="div-inscrição">
    <h2>Inscrição na corrida</h2>
  
    <form class="form-grid">
      <div class="field-group flex-2">
        <label>Atleta Cadastrado</label>
        <select [(ngModel)]="inscricao().atletaSelecionado" name="atletaSelecionado">
          <option value="">Selecione o atleta (ou digite o CPF)</option>
        </select>
      </div>
    
      <div class="buscar_cpf">
        <label>Ou Buscar por CPF</label>
        <input  type="text" [(ngModel)]="inscricao().cpfBusca" name="cpfBusca" placeholder="000.000.000-0" /> </div>
  
      <div class="corrida_escolhida">
        <label>Corrida Escolhida</label> <select [value]="corridaSelecionada()?.id" disabled name="corridaId"><option [value]="corridaSelecionada()?.id">
            {{ corridaSelecionada()?.descricao_corrida || 'Carregando corrida...' }} 
            {{ corridaSelecionada()?.data_corrida ? '(' + corridaSelecionada()?.data_corrida + ')' : '' }}
          </option>
        </select>
      </div>
  
      <div class="distancia">
        <label>Distância da Prova</label>
        <div class="radio-group">
          <label>
            <input type="radio" [(ngModel)]="inscricao().distanciaEscolhida" name="distanciaEscolhida" value="5km" /> 5km
          </label>
          <label>
            <input type="radio" [(ngModel)]="inscricao().distanciaEscolhida" name="distanciaEscolhida" value="10km" /> 10km
          </label>
          <label> <input type="radio" [(ngModel)]="inscricao().distanciaEscolhida" name="distanciaEscolhida" value="25km" /> 25km
          </label>
        </div>
      </div>
  
      <div class="tamanho_camisa">
        <label>Tamanho da Camiseta (Kit)</label>
        <select [(ngModel)]="inscricao().tamanhoCamiseta" name="tamanhoCamiseta">
          <option value="">Selecione</option>
          <option value="P">P</option>
          <option value="M">M</option>
          <option value="G">G</option>
          <option value="GG">GG</option>
        </select>
      </div>

      <div class="categoria">
        <label>Categoria / Faixa Etária</label>
        <input type="text" [value]="inscricao().categoriaFaixaEtaria" readonly class="input-readonly" name="categoriaFaixaEtaria"  />
      </div>

      <div class="valor">
        <span>Valor da Inscrição:</span>
        <strong class="preco">R$ {{ inscricao().valorInscricao.toFixed(2) }}</strong>
      </div>
     
      <div class="termos">
        <label>
          <input type="checkbox" [(ngModel)]="inscricao().aceitouTermos" name="aceitouTermos" /> 
          Li e aceito os termos do regulamento da prova e declaração de saúde.
        </label>
      </div>
      <button type="button" class="btn-finalizar" (click)="finalizarInscricao()">
        Finalizar e Ir para Pagamento
      </button>
    </form>
  </div>
