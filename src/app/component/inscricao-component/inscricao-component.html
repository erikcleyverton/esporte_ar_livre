<div id="div-inscrição">
    <h2>Inscrição na corrida</h2>
   
    <form class="form-grid">
      
        <div class="field-group flex-2">
          <label>Atleta Cadastrado</label>
          <select>
            <option value="">Selecione o atleta (ou digite o CPF)</option>
          </select>
        </div>

    <div class="buscar_cpf">
        <label>Ou Buscar por CPF</label>
        <input type="text" placeholder="000.000.000-0" />
      </div>
  
      <div class="corrida_escolhida">
        <label>Corrida Escolhida</label>
        <select>
          <option value="">uma coisa</option>
        </select>
      </div>
      <div class="distancia">
        <label>Distância da Prova</label>
        <div class="radio-group">
          <label><input type="radio" name="distancia" value="5km" /> 5km</label>
          <label><input type="radio" name="distancia" value="10km" /> 10km</label>
          <label><input type="radio" name="distancia" value="25km" /> 25km</label>
        </div>
      </div>
      <div class="tamanho_camisa">
        <label>Tamanho da Camiseta (Kit)</label>
        <select>
          <option value="">Selecione</option>
          <option value="P">P</option>
          <option value="M">M</option>
          <option value="G">G</option>
          <option value="GG">GG</option>
        </select>
      </div>
  
      <div class="categoria">
        <label>Categoria / Faixa Etária</label>
        <input type="text" value="Geral" readonly class="input-readonly" />
      </div>
  
      <div class="valor">
        <span>Valor da Inscrição:</span>
        <strong class="preco">R$ 89,90</strong>
      </div>
  
      <div class="termos">
        <label>
          <input type="checkbox" /> Li e aceito os termos do regulamento da prova e declaração de saúde.
        </label>
      </div>
  
      <button type="button" class="btn-finalizar">
        Finalizar e Ir para Pagamento
      </button>
    </form>
  </div>
