<div id="div-form">
    <h2> Cadastro atleta</h2>
    <form id="form-atleta">
        <label for="nome">Nome</label>
        <input type="text" name="nome" id="nome" class="input01" required maxlength="80" placeholder="Informe seu nome">

        <label for="cpf">CPF</label>
        <input type="text" name="cpf" id="cpf" class="input02" required maxlength="14" placeholder="Informe seu cpf">

        <label for="sexo">sexo</label>
        <input type="radio" name="sexo" id="sexoM" class="btnSelecao" value="M"> Masculino
        <input type="radio" name="sexo" id="sexoF" class="btnSelecao" value="F"> Feminino
        <input type="radio" name="sexo" id="sexoN" class="btnSelecao" value="N"> Não se Identificar

        <label for="cep">CEP</label>
        <input type="text" name="cep" id="cep" class="input02" required maxlength="9" placeholder="Informe seu cep">

        <label for="rua-logradouro">Rua/Logradouro</label>
        <input type="text" name="rua-logradouro" id="rua-logradouro" class="input01" required maxlength="100"
            placeholder="Informe rua/logradouro">

        <label for="bairro">Bairro</label>
        <input type="text" name="bairro" id="bairro" class="input02" required maxlength="20"
            placeholder="Informe seu bairro">

        <label for="cidade">Cidade</label>
        <input type="text" name="cidade" id="cidade" class="input02" required maxlength="60"
            placeholder="Informe seu cidade">

        <label for="uf">UF</label>
        <input type="text" name="uf" id="uf" class="input02" required maxlength="2" placeholder="Informe seu uf">

        <div id ="div-btns">
        
            <button type ="submit" id="BtnAdd"> Cadastar Atleta </button>
            <button type ="submit" id="BtnLimpar"> Cadastar Atleta </button>
        
        
        </div>
